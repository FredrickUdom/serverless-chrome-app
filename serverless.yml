org: freddykodes
app: chrome-serverless-app-api
service: serverless-chrome-app-role

plugins:
  - serverless-iam-roles-per-function
  - serverless-dotenv-plugin
  - serverless-offline

provider:
  name: aws
  runtime: nodejs20.x
  httpApi:
    useProviderTags: true
    cors: true
  environment:
    DYNAMODB_FEEDBACK_TABLE: ${env:DYNAMODB_FEEDBACK_TABLE}
    DYNAMODB_APPINFO_TABLE: ${env:DYNAMODB_APPINFO_TABLE}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
          Resource:
            - !GetAtt MyDynamoDBTable.Arn
            - !GetAtt AppInfoTable.Arn

functions:
  # Feedback Functions
  createPost:
    handler: src/handler.createPost
    timeout: 30
    events:
      - httpApi:
          path: /posts
          method: POST
  getAllPosts:
    handler: src/handler.getAllPosts
    timeout: 30
    events:
      - httpApi:
          path: /posts
          method: GET
  getPostById:
    handler: src/handler.getPostById
    timeout: 30
    events:
      - httpApi:
          path: /posts/{id}
          method: GET
  updatePostById:
    handler: src/handler.updatePostById
    timeout: 30
    events:
      - httpApi:
          path: /posts/{id}
          method: PUT
  deletePostById:
    handler: src/handler.deletePostById
    timeout: 30
    events:
      - httpApi:
          path: /posts/{id}
          method: DELETE

  createAppInfo:
    handler: src/handler.createAppInfo
    timeout: 30
    events:
      - httpApi:
          path: /app-info
          method: POST
  getAllAppInfo:
    handler: src/handler.getAllAppInfo
    timeout: 30
    events:
      - httpApi:
          path: /app-info
          method: GET
  getAppInfoById:
    handler: src/handler.getAppInfoById
    timeout: 30
    events:
      - httpApi:
          path: /app-info/{id}
          method: GET
  updateAppInfoById:
    handler: src/handler.updateAppInfoById
    timeout: 30
    events:
      - httpApi:
          path: /app-info/{id}
          method: PUT
  deleteAppInfoById:
    handler: src/handler.deleteAppInfoById
    timeout: 30
    events:
      - httpApi:
          path: /app-info/{id}
          method: DELETE

resources:
  Resources:
    MyDynamoDBTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: feedback
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1

    AppInfoTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: AppInfo
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 5
          WriteCapacityUnits: 1